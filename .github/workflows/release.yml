name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-jar:
    name: Build HWP Tool (JAR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build hwp-to-hwpx.jar
        run: cd tools/hwp-to-hwpx && mvn -B clean package

      - name: Copy jar to core resources
        run: cp tools/hwp-to-hwpx/target/hwp-to-hwpx.jar packages/core/resources/hwp-to-hwpx.jar

      - uses: actions/upload-artifact@v4
        with:
          name: hwp-to-hwpx-jar
          path: packages/core/resources/hwp-to-hwpx.jar

  build-release:
    name: Build (${{ matrix.label }})
    needs: build-jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            runner: macos-14
            sidecar-target: aarch64-apple-darwin
          - label: Windows
            runner: windows-latest
            sidecar-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/app/src-tauri/target
            packages/app/sidecar-shim/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/app/src-tauri/Cargo.lock', 'packages/app/sidecar-shim/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: pnpm install --frozen-lockfile

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: hwp-to-hwpx-jar
          path: packages/core/resources/

      - name: Build core & CLI
        run: pnpm build

      - name: Build JRE (jlink)
        run: pnpm build:jre

      - name: Bundle Node runtime
        run: pnpm build:node

      - name: Build CLI bundle
        run: pnpm build:cli-bundle

      - name: Prepare app resources
        run: pnpm build:app-resources

      - name: Install sidecar wrapper
        run: pnpm --filter @paper-md-studio/app sidecar:install

      # 리소스로 번들되는 네이티브 바이너리(.node 등)를 Developer ID 로 서명한다.
      #
      # 공증은 아카이브 안의 모든 Mach-O 를 검사하는데 Tauri 는 .app 껍데기만
      # 서명한다. Tauri CLI 가 키체인을 만드는 시점은 번들링 도중이라
      # beforeBundleCommand 훅에서는 아직 인증서를 쓸 수 없다 — 그래서 여기서
      # 직접 키체인을 올리고 서명한 뒤 되돌린다. 서명은 Mach-O 안에 들어가므로
      # 이후 .app 으로 복사돼도 살아남는다. 자세한 내용은 docs/RELEASE.md 참고.
      - name: Sign bundled native binaries
        if: matrix.label == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/resource-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/resource-signing.p12"
          cleanup() {
            security list-keychain -d user -s login.keychain-db || true
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
            rm -f "$CERT_PATH"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          pnpm --filter @paper-md-studio/app sign:macos-resources

      - name: Write App Store Connect API key
        if: matrix.label == 'macOS'
        shell: bash
        run: printf '%s' "${{ secrets.APPLE_API_KEY_CONTENT }}" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 업데이트 아카이브 서명용 minisign 키 (tauri signer generate).
          # 이 키가 없으면 createUpdaterArtifacts 빌드가 실패한다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID 서명 + 공증 (Windows 잡에서는 무시됨).
          # 시크릿 목록과 갱신 절차는 docs/RELEASE.md 참고.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        with:
          projectPath: packages/app
          tagName: v__VERSION__
          releaseName: Paper MD Studio v__VERSION__
          releaseBody: |
            Paper MD Studio v__VERSION__ 릴리스
          releaseDraft: true
          prerelease: false
          # Windows 업데이트 페이로드로 NSIS(.exe)를 쓴다 (msi 미배포)
          updaterJsonPreferNsis: true
