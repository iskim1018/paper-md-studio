[package]
name = "paper-md-studio"
version = "0.6.0"
description = "HWP/HWPX/DOCX/PDF 문서를 Markdown으로 변환하는 macOS/Windows 데스크톱 앱"
authors = ["Insung Kim"]
license = "MIT"
repository = "https://github.com/iskim/paper-md-studio"
edition = "2024"

[lib]
name = "paper_md_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# 자동 업데이트: updater가 새 버전을 받아 설치하고, process가 재시작한다
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.5.4"
